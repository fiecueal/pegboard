<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pegboard</title>
  <script defer src="index.js"></script>
  <!-- <script defer src="debug.js"></script> -->
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <canvas id="canvas"></canvas>
  <!-- TODO more semantic HTML -->
  <aside id="gui">
    <div id="togglers">
      <button onclick="toggleGUI('all')">toggle all</button>
      <button onclick="toggleGUI('keyboard')">keyboard</button>
      <button onclick="toggleGUI('pathdata')">path data</button>
      <button onclick="toggleGUI('tutorial')">tutorial</button>
    </div>
    <div id="keyboard">
      <button id="q" onclick="keydown({key: 'q'})">Q</button>
      <button id="w" onclick="keydown({key: 'w'})">W</button>
      <button id="e" onclick="keydown({key: 'e'})">E</button>
      <button id="r" onclick="keydown({key: 'r'})">R</button>
      <button id="t" onclick="keydown({key: 't'})">T</button>
      <button id="a" onclick="keydown({key: 'a'})">A</button>
      <button id="s" onclick="keydown({key: 's'})">S</button>
      <button id="d" onclick="keydown({key: 'd'})">D</button>
      <button id="f" onclick="keydown({key: 'f'})">F</button>
      <button id="g" onclick="keydown({key: 'g'})">G</button>
      <button id="z" onclick="keydown({key: 'z'})">Z</button>
      <button id="x" onclick="keydown({key: 'x'})">X</button>
      <button id="c" onclick="keydown({key: 'c'})">C</button>
      <button id="v" onclick="keydown({key: 'v'})">V</button>
      <button id="b" onclick="keydown({key: 'b'})">B</button>
      <button id="shift" onclick="keydown({key: 'shift', gui: true})">SHIFT</button>
    </div>
    <div id="pathdata">
      <b style="grid-column: span 2">Stroke</b>

      <label for="stroke">color</label>
      <div id="rgb-input">
        <input id="stroke" data-numtype="rgb" maxlength="6" pattern="([0-9a-fA-F]{3})*">
      </div>

      <label for="stroke-linecap">linecap</label>
      <select id="stroke-linecap">
        <option selected>butt</option>
        <option>round</option>
        <option>square</option>
      </select>

      <label for="stroke-linejoin">linejoin</label>
      <select id="stroke-linejoin">
        <option selected>miter</option>
        <option>miter-clip</option>
        <option>round</option>
        <option>arcs</option>
        <option>bevel</option>
      </select>

      <label for="stroke-opacity">opacity</label>
      <input id="stroke-opacity" type="number" data-numtype="opacity" value="100" min="0"
             max="100">

      <label for="stroke-width">width</label>
      <input id="stroke-width" type="number" data-numtype="width" value="1" min="1">

      <b style="grid-column: span 2">Fill</b>

      <label for="fill">color</label>
      <div id="rgb-input">
        <input id="fill" data-numtype="rgb" maxlength="6" pattern="([0-9a-fA-F]{3})*">
      </div>

      <label for="fill-opacity">opacity</label>
      <input id="fill-opacity" type="number" data-numtype="opacity" value="100" min="0"
             max="100">

      <label for="fill-rule">rule</label>
      <select id="fill-rule">
        <option selected>nonzero</option>
        <option>evenodd</option>
      </select>
    </div>
    <div id="tutorial">
      <b>Mouse</b>
      <dl>
        <dt>left</dt>
        <dd>click to place points</dd>
        <dd>hold and drag to move points</dd>

        <dt>middle</dt>
        <dd>scroll to zoom in/out</dd>
        <!-- TODO <dd>hold and drag to move canvas</dd> -->

        <dt>right</dt>
        <dd>click to delete points</dd>
      </dl>
      <b>Keyboard</b>
      <p>
        Hovering on the buttons reveals their function. Stroke command functionality is
        determined by the number of points placed with left click
      </p>
      <a href="https://github.com/fiecueal/pegboard">source code</a>
    </div>
  </aside>
</body>

</html>
